services:
  mysql:
    image: mysql:8.0
    container_name: medify-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: medify_secret
      MYSQL_DATABASE: medifychat
    volumes:
      - mysql_data:/var/lib/mysql
    ports:
      - "3307:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: medify-app
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      APP_ENV: production
      APP_DEBUG: false
      APP_KEY: base64:AdKPw9k77edwRTR8k3JqdwylEeDtxlkEiOIblqaL8I0=
      APP_URL: http://localhost:5001

      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: medifychat
      DB_USERNAME: root
      DB_PASSWORD: medify_secret

      LOG_CHANNEL: stderr
      SESSION_DRIVER: file
      CACHE_STORE: file
      QUEUE_CONNECTION: sync
    volumes:
      - app_storage:/var/www/html/storage
      - /var/run/docker.sock:/var/run/docker.sock
    ports:
      - "5001:80"

  bot:
    build:
      context: .
      dockerfile: Dockerfile.bot
    container_name: medify-bot
    restart: no
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: root
      DB_PASSWORD: medify_secret
      DB_NAME: medifychat

      MEDIFY_API_URL: https://rs-mulia-pajajaran.medifyapp.com/api/online
      MEDIFY_API_EMAIL: user@rsmulia.com
      MEDIFY_API_PASSWORD: 123456

      BOT_SESSION_TIMEOUT: 30
      BOT_HEARTBEAT_INTERVAL: 10000
      BOT_MESSAGE_DELAY: 3000

      GEMINI_API_KEY: ""
      ADMIN_WHATSAPP_NUMBER: 42000535535619
      PORT: 3001
    volumes:
      - bot_auth:/app/auth
    ports:
      - "3001:3001"

volumes:
  mysql_data:
  app_storage:
  bot_auth:
