<main class="w-full max-w-[440px] z-10">
<!-- Login Card -->
<div class="bg-surface-container-lowest login-card rounded-xl border border-outline-variant p-xl flex flex-col items-center">
<!-- Brand Identity -->
<div class="flex items-center gap-base mb-xl">
<div class="w-12 h-12 bg-primary rounded-xl flex items-center justify-center">
<span class="material-symbols-outlined text-on-primary text-[28px]" data-icon="medical_services">medical_services</span>
</div>
<div class="flex flex-col">
<span class="font-headline-lg text-headline-lg text-primary tracking-tight">Medify</span>
<span class="font-label-caps text-label-caps text-outline uppercase">Admin Dashboard</span>
</div>
</div>
<div class="w-full mb-lg text-center">
<h1 class="font-title-md text-title-md text-on-surface mb-xs">Welcome Back</h1>
<p class="font-body-sm text-body-sm text-on-surface-variant">Please enter your clinical credentials to access the system.</p>
</div>
<!-- Form -->
<form action="#" class="w-full space-y-lg" onsubmit="return false;">
<!-- Email Field -->
<div class="space-y-xs">
<label class="font-body-sm text-body-sm font-bold text-on-surface" for="email">Email Address</label>
<div class="relative group">
<span class="material-symbols-outlined absolute left-md top-1/2 -translate-y-1/2 text-outline group-focus-within:text-primary transition-colors" data-icon="mail">mail</span>
<input class="w-full pl-xl pr-md py-sm bg-surface-container-lowest border border-outline-variant rounded-lg font-body-sm text-on-surface placeholder:text-outline-variant focus:outline-none focus:ring-2 focus:ring-primary focus:border-primary transition-all" id="email" name="email" placeholder="admin@medify.hospital" type="email"/>
</div>
</div>
<!-- Password Field -->
<div class="space-y-xs">
<div class="flex justify-between items-center">
<label class="font-body-sm text-body-sm font-bold text-on-surface" for="password">Password</label>
<a class="font-body-sm text-body-sm text-primary hover:underline font-semibold" href="#">Forgot password?</a>
</div>
<div class="relative group">
<span class="material-symbols-outlined absolute left-md top-1/2 -translate-y-1/2 text-outline group-focus-within:text-primary transition-colors" data-icon="lock">lock</span>
<input class="w-full pl-xl pr-xl py-sm bg-surface-container-lowest border border-outline-variant rounded-lg font-body-sm text-on-surface placeholder:text-outline-variant focus:outline-none focus:ring-2 focus:ring-primary focus:border-primary transition-all" id="password" name="password" placeholder="••••••••" type="password"/>
<button class="absolute right-md top-1/2 -translate-y-1/2 text-outline hover:text-on-surface-variant transition-colors" type="button">
<span class="material-symbols-outlined" data-icon="visibility">visibility</span>
</button>
</div>
</div>
<!-- Remember Me -->
<div class="flex items-center gap-base">
<input class="w-5 h-5 rounded border-outline-variant text-primary focus:ring-primary transition-all cursor-pointer" id="remember" name="remember" type="checkbox"/>
<label class="font-body-sm text-body-sm text-on-surface-variant cursor-pointer select-none" for="remember">Remember me on this device</label>
</div>
<!-- Sign In Button -->
<button class="w-full h-[48px] bg-primary text-on-primary font-title-md text-title-md rounded-xl hover:bg-primary-container active:scale-[0.98] transition-all duration-200 shadow-sm flex items-center justify-center gap-base group" type="submit">
                    Sign In
                    <span class="material-symbols-outlined transition-transform group-hover:translate-x-1" data-icon="arrow_forward">arrow_forward</span>
</button>
</form>
<!-- Secondary Actions -->
<div class="mt-xl pt-lg border-t border-outline-variant w-full text-center">
<p class="font-body-sm text-body-sm text-on-surface-variant">
                    Don't have an account? 
                    <a class="text-primary font-bold hover:underline transition-all" href="#">Register here</a>
</p>
</div>
</div>
<!-- Footer / Trust Badges -->
<div class="mt-xl flex flex-col items-center gap-md">
<div class="flex items-center gap-lg opacity-60 grayscale hover:grayscale-0 transition-all duration-500">

<img alt="GDPR Ready" class="h-6 object-contain" data-alt="The official GDPR compliance logo with gold stars on a blue background, presented in a minimalist and sharp high-definition format to emphasize data security and privacy standards in a modern medical dashboard context." src="https://lh3.googleusercontent.com/aida-public/AB6AXuB1LwQa4KZrwxd3Pi4TkyB09QW-7EOAh2BJzIFh4hyfiHnwev5F6rWtiUc_BOcUhUtfex1ocM5VIHwOrUiMUgaFvh8EZm_QTyy0cUQl1DWkSh8TFVRzGkQogt2QtxIfdRc7Kgc-b8A9EFnvbqZEZIghTTK6eywBjCX1dXwkOya5G8jT25VF8S9eXltsVFffQoflC1o3iym6dbJLYMP8MPR5yC9SnzU5n6V0c9zZAApnSob8-JFSd1IsItDoSJXyGBCON7kcTECNmPk"/>
</div>
<p class="font-label-caps text-label-caps text-outline tracking-widest text-center px-lg">
                SECURE ACCESS • ENCRYPTED SESSION • END-TO-END DATA PROTECTION
            </p>
</div>
</main>
<script>
        // Simple micro-interaction for password visibility
        const togglePass = document.querySelector('button[type="button"]');
        const passInput = document.getElementById('password');
        const icon = togglePass.querySelector('.material-symbols-outlined');

        togglePass.addEventListener('click', () => {
            if (passInput.type === 'password') {
                passInput.type = 'text';
                icon.textContent = 'visibility_off';
            } else {
                passInput.type = 'password';
                icon.textContent = 'visibility';
            }
        });

        // Form submission ripple effect simulation
        const submitBtn = document.querySelector('button[type="submit"]');
        submitBtn.addEventListener('click', (e) => {
            if (passInput.value && document.getElementById('email').value) {
                submitBtn.innerHTML = '<span class="material-symbols-outlined animate-spin" data-icon="progress_activity">progress_activity</span> Authenticating...';
                setTimeout(() => {
                    submitBtn.innerHTML = 'Access Granted <span class="material-symbols-outlined" data-icon="check_circle">check_circle</span>';
                    submitBtn.classList.replace('bg-primary', 'bg-secondary');
                }, 1500);
            }
        });
    </script>
</body></html>
